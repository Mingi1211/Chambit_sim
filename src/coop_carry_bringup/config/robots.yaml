initial_joint_positions:
  # Inside both Gazebo and Cyclo limits; avoids the invalid all-zero elbow pose.
  arm_r_joint2: 0
  arm_l_joint2: 0
  arm_r_joint4: 0
  arm_l_joint4: 0
  arm_r_joint6: 0
  arm_l_joint6: 0
robots:
  # 박스(월드 원점)를 가운데 두고 마주 봄. 손(base 기준 x 0.40)이 박스 각자 쪽 옆면에 오는 거리
  - {name: robot1, x: -0.55, y: 0.0, z: 0.2, yaw: 0.0}
  - {name: robot2, x: 0.55, y: 0.0, z: 0.2, yaw: 3.14159265}
# --- 김민기 하위 제어 (토크 임피던스) ---------------------------------------
# position: 현대 기본(위치 서보만) / effort: 토크 경로 + 물리 1 ms + 외력 시험 플러그인 + 박스
control_mode: effort
gripper_effort: 100.0              # 그리퍼 관절 effort 한계(시뮬). 1000 → 손잡이에 파고들어 RTF 0.007. 5·20·100 모두 손가락이 q≈0.53에서 멈춤(정렬 문제로 추정)
base_motion: true                  # effort 모드: 베이스를 월드 y로 옮길 수 있게(물리 모델만 슬라이드 관절, 현대 주행 대역)
state_rate: 500                    # effort 모드 관절 상태·토크 루프 주기 [Hz] (문서 #8: D < 2Λ/T)
box:
  robot: robot1
  center_base: [0.55, 0.0, 0.85]   # robot1 base_link 기준 = 월드 원점 위
  size: [0.50, 0.66, 0.15]         # x(두 로봇 방향) y(옆면 사이) z [m]; 파지 자세 손 간격에 여유를 더함
  mass: 2.0                        # [kg] 두 로봇이 나눠 듦
  mu: 1.0
  handle: {y: 0.276, protrude: 0.05, width: 0.08, thickness: 0.030} # 손잡이 중심 간격 0.552 m; 박스 y 반폭 0.33 m 안에 배치
  place: {dx: 0.0, dy: 2.0}        # 내려놓을 받침대: 같은 높이, 월드 y로 2 m 옆
  table_size: [0.30, 0.40]         # 박스 아래 중앙 받침대
